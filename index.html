<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <!--Bootstrap css-->
   <link rel="stylesheet" href="assets/css/bootstrap.min.css"
   <!--css-->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <h1>bootstrap Grid System</h1>
    <div class="container">
        <button class="btn btn-danger text-drak">Danger</button><br><br>
        <button class="btn btn-success text-drak">Success</button><br><br>
        <div class="alert alert-primary d-flex gap-2">
            <i class="bi bi-info-circle-fill"></i>
           
            <p class="m-0">Hi, this is an alert message!</p>
        </div>
        <div class="row">
            <div class="col">
                <div class="bg-primary text-danger">color 1</div> 
                <div class="bg-secondary text-light">color 2</div>
                <div class="bg-success text-info">color 3</div>
                <div class="bg-danger text-primary">color 4</div> 
                <div class="bg-warning text-drak">color 5</div>
                <div class="bg-info text-warning">color 6</div>
                <div class="bg-light text-success">color 7</div> 
                <div class="bg-dark text-secondary">color 8</div>
             </div>
             
        </div>
       
    </div>
   
    <!--Bootstrap js-->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <!-- js-->
     <script src="assets/js/main.js"></script>
</body>
</html>
